# Site settings
title: Gavin Alberghini
tagline: MLOps & DevSecOps Team Lead
description: >-
  MLOps and DevSecOps team lead and CRE product owner at MITRE.
  Cloud platforms for public missions.
author: Gavin Alberghini

# Served at https://alberghini.io/me — the tunnel forwards that prefix
# unchanged, so local `task serve` and the container image both use it.
baseurl: "/me"
url: "https://alberghini.io"

github_username: gavinjalberghini

# Build settings
markdown: kramdown
permalink: pretty

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - Taskfile.yml
  - Dockerfile
  - .dockerignore
  - nginx-default.conf
