about:
  - >-
    I run a lean DevSecOps team for CRE — MITRE's AWS GovCloud
    collaborative research environment. The platform is a seven-figure
    program that gives mission teams a shared place to run software and
    data work, including science on petabytes of information.
  - >-
    Outside of work I teach and advise. Mentorship is not a side note:
    I am a FIRST Robotics mentor, a capstone advisor, and a former
    undergraduate CS instructor.

