name: Gavin Alberghini
role: MLOps & DevSecOps Team Lead
location: Virginia, USA
lede: >-
  DevSecOps Lead Engineer supporting software engineering and 
  data analysis across public missions at MITRE through ownership 
  of cutting edge cloud platforms that streamline capabilities 
  and accelerate time to value.

about:
  - >-
    I run a lean DevSecOps team supporting AWS govcloud collaborative
    environments at scale. These     environments operate on a seven-figure 
    budget and support data science activities across petabytes of information.
  - >-
    Outside of work I am an active member of the STEM community. Mentorship 
    and giving back to the next generation are hallmarks of my upbringing. I
    am a dedicated Teacher, FIRST Robotics Mentor, and Capstone Advisor.

