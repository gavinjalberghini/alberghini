platform:
  intro: Click a box. OSS on the left of the stack; custom on the last row.
  items:
    - name: Terraform
      kind: oss
      blurb: Idempotent AWS and cluster config. The source of truth.
    - name: Karpenter
      kind: oss
      blurb: Node provisioning for EKS — GPUs and Spot when the jobs show up.
    - name: Kyverno
      kind: oss
      blurb: Policy as code on the cluster. Guardrails, not tickets.
    - name: ACK
      kind: oss
      blurb: AWS controllers for Kubernetes — cloud resources as CRs.
    - name: Grafana LGTM
      kind: oss
      blurb: Grafana, Loki, Tempo, Mimir — metrics, logs, traces, one pane.
    - name: GHA ARC
      kind: oss
      blurb: Actions Runner Controller. CI that lives next to the workloads.
    - name: Harbor
      kind: oss
      blurb: Internal registry. Images we trust, scanned before they run.
    - name: Calico
      kind: oss
      blurb: Cluster networking and network policy.
    - name: AWS LBC
      kind: oss
      blurb: AWS Load Balancer Controller. Ingress that maps to ALB/NLB.
    - name: cert-manager
      kind: oss
      blurb: Certificates as cluster objects. No one copies PEMs by hand.
    - name: NVIDIA GPU
      kind: oss
      blurb: Device plugin so Jupyter and Spark can actually see the GPUs.
    - name: Catalog & audit
      kind: custom
      blurb: Custom cataloging and audit — who ran what, on which data.
    - name: PR automation
      kind: custom
      blurb: Custom PR and automation management. The path to prod is a PR.
    - name: IaaS workflows
      kind: custom
      blurb: Custom IaaS workflows and the other glue we write ourselves.

