name: Gavin Alberghini
role: MLOps & DevSecOps Team Lead
location: Virginia, USA
lede: >-
  MLOps and DevSecOps team lead and Collaborative Research Enclave
  (CRE) product owner. I support software engineers and data analysts
  across public missions by building and operating cloud platforms
  that streamline capability at MITRE.

about:
  - >-
    I'm Gavin. Since June 2025 I have been a group leader at MITRE —
    MLOps and DevSecOps team lead, and CRE product owner. I manage
    about six engineers who
    run an AWS environment centered on EKS, with a seven-figure
    annual budget, for data science at scale on petabytes of FAA data.
  - >-
    We run that estate with open-source and custom software.
    Terraform, Karpenter, Kyverno, ACK, the Grafana LGTM stack,
    Actions Runner Controller, Harbor, Calico, the AWS load balancer
    controller, cert-manager, the NVIDIA GPU plugin — plus cataloging
    and audit tools, PR and automation management, IaaS workflows,
    and the other automation we write ourselves. I champion
    infrastructure as code, idempotent operations, CMMC, data
    engineering, and machine learning.
  - >-
    Before MITRE I studied computer science at Virginia Commonwealth
    University (B.S. 2020, summa cum laude; M.S. 2021) and published
    on continual learning for multi-label drifting data streams.
  - >-
    I have been around FIRST Robotics since 2012 — alumnus, programming
    mentor, and event volunteer. Control systems at district events is
    the part I keep showing up for. FRC-SS is the public playbook from
    that work.

