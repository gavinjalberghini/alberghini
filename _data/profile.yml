about:
  - >-
    Group leader at MITRE since June 2025. I run a six-engineer
    DevSecOps group and own CRE — an AWS / EKS environment with a
    seven-figure budget, doing data science on petabytes of FAA data.
  - >-
    I mentor outside the day job: Unity at Grassfield STEM, ML
    capstones at the Governor's School, and an ODU senior project —
    plus FIRST since 2012. VCU B.S. 2020 (summa) and M.S. 2021;
    the paper below is the thesis, published.

