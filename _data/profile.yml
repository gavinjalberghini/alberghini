research:
  - kind: Journal article
    title: >-
      Adaptive ensemble of self-adjusting nearest neighbor subspaces for
      multi-label drifting data streams
    venue: Neurocomputing, vol. 481, pp. 228–248, 2022
    authors: Gavin Alberghini, Sylvio Barbon Junior, Alberto Cano
    doi: https://doi.org/10.1016/j.neucom.2022.01.075
    researchgate: https://www.researchgate.net/publication/358109395_Adaptive_Ensemble_of_Self-Adjusting_Nearest_Neighbor_Subspaces_for_Multi-Label_Drifting_Data_Streams
    code: https://github.com/canoalberto/AESAKNNS
    summary: >-
      AESAKNNS is an ensemble of self-adjusting kNN classifiers for
      multi-label streams that drift over time. Each base learner trains
      on its own feature subspace and an online-bagging sample; ADWIN
      detectors watch for concept drift and a background ensemble is
      trained on new subspaces so the most accurate classifiers can
      replace the current set. Evaluated against 30 classifiers on 30
      datasets and 12 metrics.

  - kind: Master's thesis
    title: >-
      Continual learning for multi-label drifting data streams using
      homogeneous ensemble of self-adjusting nearest neighbors
    venue: Virginia Commonwealth University, May 2021
    authors: Gavin Alberghini
    url: https://scholarscompass.vcu.edu/cgi/viewcontent.cgi?article=7725&context=etd
    summary: >-
      The thesis that the Neurocomputing paper grew out of — a
      homogeneous ensemble of MLSAkNN base classifiers for continual
      multi-label learning under concept drift.

