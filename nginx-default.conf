# nginx-unprivileged listens on 8080. Without these, a request for /me
# (no trailing slash) 301s to http://<host>:8080/me/, which is wrong
# behind the Cloudflare Tunnel.
server {
    listen 8080;
    server_name localhost;

    absolute_redirect off;
    port_in_redirect off;

    # Unity WebGL builds are gzip-compressed on disk (.unityweb). The
    # loader can inflate in JS, but sending Content-Encoding skips that.
    location ~* \.unityweb$ {
        root /usr/share/nginx/html;
        gzip off;
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
