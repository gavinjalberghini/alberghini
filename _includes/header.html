<aside class="rail">
  <div class="rail-inner">
    <img
      class="rail-photo"
      src="{{ '/assets/images/portrait.jpg' | relative_url }}"
      alt="{{ site.data.profile.name }}"
      width="720"
      height="720">
    <p class="rail-role">{{ site.data.profile.role }}</p>
    <a class="rail-name" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    <p class="rail-lede">{{ site.data.profile.lede }}</p>

    <nav class="rail-nav" aria-label="Primary">
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#education">Education</a>
      <a href="#mentoring">Mentoring</a>
      <a href="#work">Highlights</a>
      <a href="#research">Research</a>
      <a href="#hobbies">Hobbies</a>
    </nav>

    <ul class="rail-links">
      {% for link in site.data.profile.links %}
        <li>
          <a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.label }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
</aside>
