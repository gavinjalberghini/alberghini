name: Publish container image

# Builds the linux/arm64 image the Pantry homelab cluster pulls
# (ghcr.io/<owner>/alberghini) and pushes it to GHCR.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: "container"
  cancel-in-progress: true

jobs:
  publish:
    # Native arm64 runner (free for public repos). The cluster's Raspberry Pi
    # workers need linux/arm64, and building natively avoids emulating the
    # whole Jekyll build under QEMU.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # :latest is what the cluster manifest tracks; the sha tag makes
          # any previous build recoverable/pinnable.
          tags: |
            ghcr.io/${{ github.repository_owner }}/alberghini:latest
            ghcr.io/${{ github.repository_owner }}/alberghini:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
